name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: point-system-production
  cancel-in-progress: false

env:
  COMPOSE_ENV_FILE: /etc/point-system/production.env
  COMPOSE_FILE: docker-compose.production.yml

jobs:
  deploy:
    runs-on: [self-hosted, linux, point-system-prod]
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployment configuration
        run: test -r "$COMPOSE_ENV_FILE"

      - name: Validate Compose configuration
        run: docker compose --env-file "$COMPOSE_ENV_FILE" -f "$COMPOSE_FILE" config --quiet

      - name: Build production images
        run: docker compose --env-file "$COMPOSE_ENV_FILE" -f "$COMPOSE_FILE" build

      - name: Apply database migrations
        run: |
          docker compose --env-file "$COMPOSE_ENV_FILE" -f "$COMPOSE_FILE" up -d db
          docker compose --env-file "$COMPOSE_ENV_FILE" -f "$COMPOSE_FILE" run --rm backend node dist/migrate.js

      - name: Start application
        run: docker compose --env-file "$COMPOSE_ENV_FILE" -f "$COMPOSE_FILE" up -d --remove-orphans

      - name: Smoke test
        run: |
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8787/api/health
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:8080/
