name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: point-system-production
  cancel-in-progress: false

env:
  COMPOSE_FILE: docker-compose.production.yml

jobs:
  deploy:
    runs-on: [self-hosted, linux, point-system-prod]
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deployment secrets
        env:
          PROD_POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          PROD_IDENTITY_CODE_SECRET: ${{ secrets.PROD_IDENTITY_CODE_SECRET }}
          PROD_TURNSTILE_SECRET: ${{ secrets.PROD_TURNSTILE_SECRET }}
          PROD_VITE_TURNSTILE_SITE_KEY: ${{ secrets.PROD_VITE_TURNSTILE_SITE_KEY }}
        run: |
          set -eu
          : "${PROD_POSTGRES_PASSWORD:?PROD_POSTGRES_PASSWORD is required}"
          : "${PROD_DATABASE_URL:?PROD_DATABASE_URL is required}"
          : "${PROD_IDENTITY_CODE_SECRET:?PROD_IDENTITY_CODE_SECRET is required}"
          : "${PROD_TURNSTILE_SECRET:?PROD_TURNSTILE_SECRET is required}"
          : "${PROD_VITE_TURNSTILE_SITE_KEY:?PROD_VITE_TURNSTILE_SITE_KEY is required}"

          env_file="$RUNNER_TEMP/point-system.production.env"
          umask 077
          {
            printf 'POSTGRES_PASSWORD=%s\n' "$PROD_POSTGRES_PASSWORD"
            printf 'DATABASE_URL=%s\n' "$PROD_DATABASE_URL"
            printf 'IDENTITY_CODE_SECRET=%s\n' "$PROD_IDENTITY_CODE_SECRET"
            printf 'TURNSTILE_SECRET=%s\n' "$PROD_TURNSTILE_SECRET"
            printf 'VITE_TURNSTILE_SITE_KEY=%s\n' "$PROD_VITE_TURNSTILE_SITE_KEY"
          } > "$env_file"
          echo "COMPOSE_ENV_FILE=$env_file" >> "$GITHUB_ENV"

      - name: Verify deployment configuration
        run: test -r "$COMPOSE_ENV_FILE"

      - name: Validate Compose configuration
        run: docker compose --env-file "$COMPOSE_ENV_FILE" -f "$COMPOSE_FILE" config --quiet

      - name: Build production images
        run: docker compose --env-file "$COMPOSE_ENV_FILE" -f "$COMPOSE_FILE" build

      - name: Apply database migrations
        run: |
          docker compose --env-file "$COMPOSE_ENV_FILE" -f "$COMPOSE_FILE" up -d db
          docker compose --env-file "$COMPOSE_ENV_FILE" -f "$COMPOSE_FILE" run --rm backend node dist/migrate.js

      - name: Start application
        run: docker compose --env-file "$COMPOSE_ENV_FILE" -f "$COMPOSE_FILE" up -d --remove-orphans

      - name: Smoke test
        run: |
          set -eu

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/api/health; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 2
          done

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 2
          done

      - name: Show service status on failure
        if: failure()
        run: |
          docker compose --env-file "$COMPOSE_ENV_FILE" -f "$COMPOSE_FILE" ps
          docker compose --env-file "$COMPOSE_ENV_FILE" -f "$COMPOSE_FILE" logs --tail=100 backend frontend db

      - name: Remove temporary deployment secrets
        if: always()
        run: |
          if [ -n "${COMPOSE_ENV_FILE:-}" ] && [ -f "$COMPOSE_ENV_FILE" ]; then
            rm -f -- "$COMPOSE_ENV_FILE"
          fi
